<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Birthday Surprise 💖</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;700&family=Pacifico&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Montserrat',sans-serif;
}

body{
overflow:hidden;
background:black;
color:white;
}

/* COMMON */

.page{
width:100%;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
text-align:center;
padding:20px;
}

/* ================= PAGE 1 ================= */

#page1{
background:linear-gradient(135deg,#000428,#004e92);
}

.qr-box{
width:240px;
height:240px;
background:white;
padding:15px;
border-radius:20px;
position:relative;
margin-top:20px;
box-shadow:0 0 30px cyan;
}

.qr-box img{
width:100%;
height:100%;
}

.scan-line{
width:210px;
height:4px;
background:red;
position:absolute;
left:15px;
animation:scan 2s linear infinite;
}

@keyframes scan{

0%{
top:20px;
}

100%{
top:210px;
}

}

.next-btn{
margin-top:30px;
padding:14px 35px;
border:none;
border-radius:40px;
background:#ff0080;
color:white;
font-size:18px;
cursor:pointer;
}

/* ================= PAGE 2 ================= */

#page2{
display:none;
background:linear-gradient(135deg,#111827,#1e293b,#000);
position:relative;
overflow:hidden;
}

.profile{
width:180px;
height:180px;
border-radius:50%;
object-fit:cover;
border:5px solid white;
box-shadow:0 0 25px hotpink;
}

h1{
font-size:55px;
margin-top:20px;
font-family:'Pacifico',cursive;
color:#ffd166;
}

.btn{
padding:14px 30px;
margin:10px;
border:none;
border-radius:40px;
font-size:18px;
cursor:pointer;
}

.yes-btn{
background:#ff0080;
color:white;
}

.no-btn{
background:white;
color:black;
position:relative;
}

/* ================= PAGE 3 ================= */

#page3{
display:none;
background:linear-gradient(135deg,#200122,#6f0000);
overflow:auto;
}

.gallery{
margin-top:30px;
}

.gallery img{
width:180px;
height:180px;
object-fit:cover;
border-radius:20px;
margin:10px;
box-shadow:0 0 20px white;
animation:pop 1s ease;
}

@keyframes pop{

0%{
transform:scale(0);
}

100%{
transform:scale(1);
}

}

/* ================= PAGE 4 ================= */

#page4{
display:none;
background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
}

.final-message{
font-size:28px;
line-height:1.8;
color:#ffd166;
max-width:700px;
}

.music-btn{
margin-top:30px;
padding:14px 35px;
border:none;
border-radius:40px;
background:#ff0080;
color:white;
font-size:18px;
cursor:pointer;
}

/* HEART */

.heart{
position:absolute;
font-size:25px;
color:pink;
animation:fly 4s linear forwards;
}

@keyframes fly{

0%{
transform:translateY(0);
opacity:1;
}

100%{
transform:translateY(-100vh);
opacity:0;
}

}

/* MOBILE */

@media(max-width:600px){

h1{
font-size:40px;
}

.gallery img{
width:130px;
height:130px;
}

.profile{
width:140px;
height:140px;
}

}

</style>
</head>
<body>

<!-- ================= PAGE 1 ================= -->

<div class="page" id="page1">

<h1 style="font-size:45px;">Birthday Surprise 🎁</h1>

<p style="margin-top:10px;">
Scan To Open Surprise 💖
</p>

<div class="qr-box">

<img src="code.png">

<div class="scan-line"></div>

</div>

<button class="next-btn" onclick="openPage2()">
Open Surprise ✨
</button>

</div>

<!-- ================= PAGE 2 ================= -->

<div class="page" id="page2">

<img src="pic1.jpg" class="profile">

<h1>Happy Birthday 🎂</h1>

<p style="margin-top:15px; font-size:22px;">
Will You Stay Forever Special? 🥺
</p>

<div style="margin-top:30px;">

<button class="btn yes-btn" onclick="openPage3()">
Yes 💖
</button>

<button class="btn no-btn" id="noBtn">
No 😒
</button>

</div>

</div>

<!-- ================= PAGE 3 ================= -->

<div class="page" id="page3">

<h1>Beautiful Memories ✨</h1>

<div class="gallery">

<img src="pic5.jpg">
<img src="pic2.jpg">
<img src="pic3.jpg">
<img src="pic4.jpg">

</div>

<button class="next-btn" onclick="openPage4()">
Next Surprise 🎵
</button>

</div>

<!-- ================= PAGE 4 ================= -->

<div class="page" id="page4">

<div class="final-message">

You are the best thing that ever happened in my life 💖✨
<br><br>
May your smile always stay forever 🌸

</div>

<button class="music-btn" onclick="playMusic()">
fav one Song 🎵
</button>

<audio id="music" loop>

<source src="song.mp3.mp3" type="audio/mp3">

</audio>

</div>

<script>

/* PAGE CHANGE */

function openPage2(){

document.getElementById('page1').style.display='none';

document.getElementById('page2').style.display='flex';

}

function openPage3(){

document.getElementById('page2').style.display='none';

document.getElementById('page3').style.display='flex';

/* HEARTS */

for(let i=0;i<80;i++){

let heart=document.createElement('div');

heart.classList.add('heart');

heart.innerHTML='💖';

heart.style.left=Math.random()*100+'vw';

heart.style.top='100vh';

document.body.appendChild(heart);

setTimeout(()=>{
heart.remove();
},4000);

}

}

function openPage4(){

document.getElementById('page3').style.display='none';

document.getElementById('page4').style.display='flex';

}

/* MUSIC */

function playMusic(){

document.getElementById('music').play();

}

/* RUNNING NO BUTTON */

const noBtn=document.getElementById('noBtn');

noBtn.addEventListener('mouseover',()=>{

noBtn.style.position='absolute';

noBtn.style.top=Math.random()*80+'vh';

noBtn.style.left=Math.random()*80+'vw';

});

</script>

</body>
</html>
